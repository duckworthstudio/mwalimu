<section
    id="contact"
    class="reveal contact-section"
>

    <div class="wrap">

        <div class="contact-wrap">


            <div class="contact-info">

                <span class="eyebrow">
                    Say Hello
                </span>


                <h2>
                    Let's talk
                </h2>


                <p>
                    Questions about homework, classroom
                    volunteering, or just want to say hi?
                    My inbox is always open.
                </p>


                <div class="info-line">

                    <span class="info-dot"></span>

                    mercy.classroom@example.com

                </div>


                <div class="info-line">

                    <span class="info-dot"></span>

                    Room 12, Maple Street Elementary

                </div>


                <div class="info-line">

                    <span class="info-dot"></span>

                    Office hours: Tue & Thu, 3:15–4:00pm

                </div>

            </div>


            <form id="contact-form">


                <div class="field">

                    <label for="name">
                        Your name
                    </label>

                    <input
                        id="name"
                        name="name"
                        type="text"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="field">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Send Note
                </button>


                <p
                    id="sent-msg"
                    class="sent-message"
                    role="status"
                    aria-live="polite"
                >
                    Thanks! Your note has been sent. 💌
                </p>

            </form>


        </div>

    </div>

</section>
